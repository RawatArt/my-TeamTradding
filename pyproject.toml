[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-team"
version = "0.5.0"
description = "A safety-first, AI-assisted trading research platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "AI Trading Team" }]
dependencies = [
    "MetaTrader5==5.0.6180; sys_platform == 'win32'",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[project.scripts]
ai-trading-team = "ai_trading_team.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
cache_dir = ".cache/pytest"
minversion = "8.0"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "mt5_integration: requires an explicitly enabled Windows MT5 demo terminal",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true
